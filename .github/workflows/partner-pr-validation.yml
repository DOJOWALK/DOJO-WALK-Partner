name: Partner Flutter PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: partner-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test Partner app (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify required Partner assets
        run: |
          test -s "assets/icon/DOJO WALK PARTNER APP ICON .png"
          test -s "assets/icon/DOJO WALK PARTNER SPLASH.png"

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
