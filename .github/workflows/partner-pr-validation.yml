name: DOJO WALK Partner PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'assets/**'
      - 'android/**'
      - '.github/workflows/partner-pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and debug-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Partner app image assets
        run: |
          test -f "assets/icon/DOJO WALK PARTNER APP ICON .png"
          test -f "assets/icon/DOJO WALK PARTNER SPLASH.png"

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
