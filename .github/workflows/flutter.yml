name: DOJO WALK Partner Release APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build DOJO WALK Partner APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Validate the checked-in backend/config files without deploying them.
      - name: Validate Firebase backend syntax and config
        run: |
          node --check functions/index.js
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Verify image assets exist
      - name: Verify Partner App Images
        run: |
          test -f "assets/icon/DOJO WALK PARTNER APP ICON .png"
          test -f "assets/icon/DOJO WALK PARTNER SPLASH.png"

      # 5. Generate Android Launcher Icon
      - name: Generate Android Launcher Icon
        run: dart run flutter_launcher_icons

      # 6. Analyze Flutter code
      - name: Analyze Flutter code
        run: flutter analyze

      # 7. Run Flutter tests
      - name: Run Flutter tests
        run: flutter test

      # 8. Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 9. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walk-partner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
