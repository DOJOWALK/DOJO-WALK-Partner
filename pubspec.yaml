name: dojo_partner
description: DOJO WALK Partner - Walker App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # Camera
  camera: ^0.11.2

  # Face detection
  google_mlkit_face_detection: ^0.13.1

  # Image quality processing
  image: ^4.5.4

  # Existing packages
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Android App Launcher Icon
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/dojo_walk_partner_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Partner App Images
  assets:
    - assets/images/dojo_walk_partner_icon.png
    - assets/images/dojo_walk_partner_splash.png
